# Alembic config template — copy into a service dir alongside a `migrations/`
# folder (env.py + script.py.mako + versions/). The DB URL is taken from the
# service's DATABASE_URL env at runtime; the value below is a harmless default.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///service.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
