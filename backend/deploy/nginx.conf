# Nginx front for LARE — TLS terminator + single public entry to the Gateway.
# Only the Gateway (:8000) is exposed; it fans out to the 25 internal services,
# which bind to 127.0.0.1 only. The SPA (frontend/dist) is served as static files.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/lare && \
#   sudo ln -s /etc/nginx/sites-available/lare /etc/nginx/sites-enabled/ && \
#   sudo nginx -t && sudo systemctl reload nginx

upstream lare_gateway { server 127.0.0.1:8000; keepalive 32; }

# Rate-limit at the edge in addition to the Gateway's own limiter.
limit_req_zone $binary_remote_addr zone=lare_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lms.example.edu;               # <-- your domain

    ssl_certificate     /etc/letsencrypt/live/lms.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;                  # resume/certificate uploads

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- SPA (React build) ---
    root /opt/lare/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API -> Gateway (the /api prefix is stripped to match dev proxy) ---
    location /api/ {
        limit_req zone=lare_api burst=40 nodelay;
        proxy_pass http://lare_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (exam/proctoring live streams)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
