# LARE host nginx (no Docker). Serves the built React SPA and proxies /api to the
# gateway on 127.0.0.1:8000. Install as /etc/nginx/sites-available/lare and symlink
# into sites-enabled. This is the CEO guide's Phase 14, corrected: it must serve
# the frontend AND proxy the API — not just proxy everything to one port.
#
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/lare
#   sudo ln -sf /etc/nginx/sites-available/lare /etc/nginx/sites-enabled/lare
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name larelms.com www.larelms.com;   # change to your domain (or _ for IP-only testing)

    # Built SPA lives here (see step 3 — npm run build, copy dist to this path).
    root /var/www/lare;
    index index.html;

    # ALB health-check target.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # API -> gateway. Trailing slash strips the /api prefix so it matches the
    # gateway's own routes (same behaviour as the Vite dev proxy).
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 130s;      # LLM generation / code runs are slow
        proxy_send_timeout 130s;
        proxy_buffering    off;       # keep SSE / streaming live

        # API responses are per-user (profile, sessions, results). Forbid any
        # caching so a shared browser never serves one student's data to another.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }   # SPA routing fallback

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
