# LARE edge: serve the built React SPA and reverse-proxy the API to the gateway.
# TLS is terminated upstream by the AWS Application Load Balancer (ACM cert), so
# this listens plain on :80 inside the VPC. For a no-ALB single box, add a 443
# server block with certbot certs instead.

upstream lare_gateway {
    server backend:8000;      # docker-compose service name; 127.0.0.1:8000 if host-networked
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health probe target for the ALB.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # API — strip the /api prefix (trailing slash on proxy_pass) so it matches
    # the gateway's own routes, exactly like the Vite dev proxy rewrite.
    location /api/ {
        proxy_pass         http://lare_gateway/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # LLM generation / code execution are legitimately slow (see gateway
        # SLOW_ROUTES). Give proxied requests generous head-room.
        proxy_read_timeout    130s;
        proxy_send_timeout    130s;
        proxy_buffering       off;   # keep SSE / streaming responses live
    }

    # Static SPA with client-side routing fallback.
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 25m;   # resume / assignment uploads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
